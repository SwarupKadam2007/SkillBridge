name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install mobile dependencies
        run: |
          cd mobile
          npm ci

      - name: 6. Prebuild native Android project
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: 7. Build standalone Release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 8. Rename APK artifact
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk SkillBridge.apk || cp mobile/android/app/build/outputs/apk/release/app-release.apk SkillBridge.apk || cp mobile/android/app/build/outputs/apk/debug/app-debug.apk SkillBridge.apk

      - name: 9. Create GitHub Release with Permanent Download Link
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: SkillBridge Campus App ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: SkillBridge.apk
          body: |
            ## 📱 SkillBridge Campus Android App
            
            Download the standalone APK directly to your phone:
            
            👉 **[Download SkillBridge.apk](https://github.com/${{ github.repository }}/releases/latest/download/SkillBridge.apk)**
            
            ### Installation Instructions:
            1. Tap the download link above on your Android phone.
            2. When downloaded, open the `.apk` file.
            3. If prompted with *"Install unknown apps"*, allow your browser to install apps.
            4. Tap **Install** and open SkillBridge!
