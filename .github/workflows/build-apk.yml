name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: cd mobile && npm ci
      - run: cd mobile && npx expo prebuild --platform android --no-install
      - run: cd mobile/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk SkillBridge.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: SkillBridge.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
