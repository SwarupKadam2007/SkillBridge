name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Install dependencies
        run: |
          cd mobile
          npm ci

      - name: 5. Prebuild native Android project
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: 6. Build Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Prepare APK file
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk SkillBridge.apk

      - name: 8. Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SkillBridge Campus App v1.0.0
          files: SkillBridge.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
